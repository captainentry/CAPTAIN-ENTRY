<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trade With Captain · Pro Dashboard</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0b0e14; font-family: 'Inter', sans-serif; color: #e9edf5; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 18px; }
    .btn-primary { background: linear-gradient(135deg, #3b82f6, #6366f1); border: none; color: white; font-weight: 700; padding: 14px 24px; border-radius: 14px; font-size: 0.95rem; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; transition: 0.2s; text-decoration: none; }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 10px 25px -8px rgba(59,130,246,0.5); }
    .btn-secondary { background: transparent; border: 1px solid #2b3547; color: #e9edf5; font-weight: 600; padding: 14px 24px; border-radius: 14px; font-size: 0.95rem; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; transition: 0.2s; }
    .btn-secondary:hover { background: #1a212e; }

    /* ===== LANDING PAGE ===== */
    #landingPage { display: block; width: 100%; max-width: 1200px; padding: 20px 0; }
    .landing-nav { display: flex; justify-content: space-between; align-items: center; padding: 0 20px 40px 20px; }
    .landing-logo { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 1.3rem; }
    .landing-logo-icon { background: linear-gradient(145deg, #3b82f6, #8b5cf6); width: 36px; height: 36px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 18px; }
    .hero { text-align: center; padding: 40px 20px; }
    .hero h1 { font-size: 3rem; font-weight: 800; letter-spacing: -1px; margin-bottom: 16px; background: linear-gradient(135deg, #f0f4ff, #7aa9ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .hero p { color: #8898b8; font-size: 1.1rem; max-width: 600px; margin: 0 auto 32px auto; line-height: 1.6; }
    .hero-cta { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-bottom: 24px; }
    .hero-checkmarks { display: flex; gap: 24px; justify-content: center; color: #8898b8; font-size: 0.85rem; flex-wrap: wrap; }
    .hero-checkmarks span { display: flex; align-items: center; gap: 6px; }
    .hero-checkmarks i { color: #22c55e; }

    .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; padding: 40px 20px; }
    .stat-box { background: #0f131c; border: 1px solid #1e2532; border-radius: 20px; padding: 24px; text-align: center; }
    .stat-box .num { font-family: 'JetBrains Mono', monospace; font-size: 1.8rem; font-weight: 700; color: #7aa9ff; }
    .stat-box .lbl { color: #6a7893; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.5px; margin-top: 6px; font-weight: 600; }

    .features-section { padding: 40px 20px; }
    .features-section h2 { text-align: center; font-size: 2rem; font-weight: 700; margin-bottom: 40px; }
    .features-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
    .feature-card { background: #0f131c; border: 1px solid #1e2532; border-radius: 20px; padding: 28px; transition: 0.2s; }
    .feature-card:hover { border-color: #2b3547; transform: translateY(-3px); }
    .feature-icon { width: 48px; height: 48px; border-radius: 14px; background: rgba(59,130,246,0.13); color: #7aa9ff; display: flex; align-items: center; justify-content: center; font-size: 1.3rem; margin-bottom: 18px; }
    .feature-card h3 { font-size: 1.15rem; margin-bottom: 8px; }
    .feature-card p { color: #8898b8; font-size: 0.9rem; line-height: 1.5; }

    /* ===== TESTIMONIALS ===== */
    .testimonials-section { padding: 40px 20px; }
    .testimonials-section h2 { text-align: center; font-size: 2rem; font-weight: 700; margin-bottom: 40px; }
    .testimonials-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px; }
    .testimonial-card { background: #0f131c; border: 1px solid #1e2532; border-radius: 22px; padding: 28px 24px; text-align: center; transition: 0.2s; display: flex; flex-direction: column; align-items: center; }
    .testimonial-card:hover { border-color: #2b3547; transform: translateY(-3px); }
    .testimonial-profile { display: flex; flex-direction: column; align-items: center; margin-bottom: 16px; }
    .testimonial-avatar { width: 72px; height: 72px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 1.4rem; color: white; margin-bottom: 12px; border: 3px solid #12161f; box-shadow: 0 8px 20px -6px rgba(59,130,246,0.4); letter-spacing: 0.5px; }
    .testimonial-name { font-weight: 700; font-size: 1rem; color: #eef3ff; margin-bottom: 4px; }
    .testimonial-role { font-size: 0.72rem; color: #7aa9ff; font-weight: 600; background: rgba(59,130,246,0.1); border: 1px solid rgba(59,130,246,0.2); padding: 3px 10px; border-radius: 100px; }
    .testimonial-stars { color: #fbbf24; font-size: 1.05rem; letter-spacing: 3px; margin-bottom: 14px; }
    .testimonial-text { color: #c8d3e8; font-size: 0.88rem; line-height: 1.65; font-style: italic; margin: 0; }

    /* ===== DISCLAIMER ===== */
    .disclaimer-box { margin: 40px 20px 20px 20px; padding: 24px 26px; background: rgba(245, 158, 11, 0.06); border: 1px solid rgba(245, 158, 11, 0.25); border-left: 4px solid #fbbf24; border-radius: 16px; }

    .disclaimer-text strong { color: #e9edf5; font-weight: 600; }
    .disclaimer-small { font-size: 0.75rem; color: #6a7893; border-top: 1px solid rgba(245, 158, 11, 0.15); padding-top: 12px; margin-top: 4px; margin-bottom: 0; }

    /* ===== AUTH SCREEN ===== */
    #authScreen { display: none; justify-content: center; align-items: center; min-height: 100vh; width: 100%; padding: 20px; }
    .auth-card { background: #12161f; border-radius: 28px; border: 1px solid #1e2532; padding: 40px 32px; width: 100%; max-width: 420px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.8); position: relative; }
    .back-home { position: absolute; top: 20px; left: 20px; color: #6a7893; font-size: 0.8rem; text-decoration: none; cursor: pointer; display: flex; align-items: center; gap: 6px; }
    .back-home:hover { color: #e9edf5; }
    .auth-logo { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; justify-content: center; }
    .auth-logo-icon { background: linear-gradient(145deg, #3b82f6, #8b5cf6); width: 48px; height: 48px; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 24px; }
    .auth-logo-text { font-weight: 700; font-size: 1.4rem; background: linear-gradient(135deg, #f0f4ff, #b4c8ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; text-align: center; line-height: 1.1; }
    .auth-tagline { text-align: center; color: #7b88a4; font-size: 0.85rem; margin-bottom: 20px; }
    .auth-social-proof { display: flex; justify-content: center; gap: 20px; padding: 14px; background: #0b0f16; border-radius: 14px; border: 1px solid #1e2532; margin-bottom: 24px; }
    .proof-item { text-align: center; }
    .proof-num { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 1.05rem; color: #7aa9ff; }
    .proof-label { font-size: 0.65rem; color: #6a7893; text-transform: uppercase; letter-spacing: 0.5px; margin-top: 2px; font-weight: 600; }
    .auth-tabs { display: flex; background: #0b0f16; border-radius: 14px; padding: 4px; margin-bottom: 24px; border: 1px solid #1e2532; }
    .auth-tab { flex: 1; padding: 10px; text-align: center; border-radius: 10px; cursor: pointer; font-weight: 600; font-size: 0.85rem; color: #6a7893; transition: 0.2s; border: none; background: transparent; }
    .auth-tab.active { background: #1e2532; color: #e9edf5; }
    .auth-form-group { margin-bottom: 16px; }
    .auth-form-group label { display: block; font-size: 0.75rem; font-weight: 600; color: #8898b8; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
    .auth-input { width: 100%; background: #0b0f16; border: 1px solid #252f41; border-radius: 14px; padding: 14px 16px; color: white; font-size: 0.95rem; outline: none; transition: 0.2s; }
    .auth-input:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,0.15); }
    .auth-btn { width: 100%; background: linear-gradient(135deg, #3b82f6, #6366f1); border: none; color: white; font-weight: 700; padding: 15px; border-radius: 16px; font-size: 0.95rem; cursor: pointer; margin-top: 8px; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .auth-btn:hover { transform: translateY(-1px); }
    .guest-btn { width: 100%; background: transparent; border: 1px solid #2b3547; color: #a6b3d0; font-weight: 600; padding: 13px; border-radius: 16px; font-size: 0.85rem; cursor: pointer; margin-top: 12px; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .guest-btn:hover { background: #1a212e; color: white; }
    .auth-message { margin-top: 16px; padding: 12px 16px; border-radius: 12px; font-size: 0.85rem; display: none; }
    .auth-message.error { background: rgba(239,68,68,0.12); color: #fca5a5; border: 1px solid rgba(239,68,68,0.3); display: block; }
    .auth-message.success { background: rgba(34,197,94,0.12); color: #86efac; border: 1px solid rgba(34,197,94,0.3); display: block; }

    /* ===== DASHBOARD ===== */
    #dashboard { display: none; width: 100%; max-width: 1440px; }
    .dashboard-inner { background: #12161f; border-radius: 32px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.8), 0 0 0 1px rgba(255,255,255,0.03); padding: 24px 28px; display: flex; flex-direction: column; gap: 18px; }
    .top-bar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px; }
    .logo-area { display: flex; align-items: center; gap: 12px; }
    .logo-icon { background: linear-gradient(145deg, #3b82f6, #8b5cf6); width: 42px; height: 42px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 22px; }
    .logo-text { font-weight: 700; font-size: 1.5rem; background: linear-gradient(135deg, #f0f4ff, #b4c8ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .badge-pro { background: rgba(59,130,246,0.15); border: 1px solid rgba(59,130,246,0.3); padding: 4px 10px; border-radius: 100px; font-size: 0.7rem; font-weight: 600; color: #7aa9ff; margin-left: 6px; }
    .user-profile { display: flex; align-items: center; gap: 12px; }
    .user-email { font-size: 0.8rem; color: #9aa8c7; max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .logout-btn { background: #1a1f2b; border: 1px solid #252e3e; color: #9aa8c7; padding: 8px 14px; border-radius: 12px; font-size: 0.8rem; font-weight: 600; cursor: pointer; transition: 0.2s; }
    .logout-btn:hover { background: #232a39; color: white; }
    .trust-bar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; background: linear-gradient(135deg, #0f1420, #131a28); border: 1px solid #1e2532; border-radius: 20px; padding: 14px 18px; }
    .trust-item { display: flex; align-items: center; gap: 12px; }
    .trust-icon { width: 38px; height: 38px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 1rem; flex-shrink: 0; }
    .trust-icon.blue { background: rgba(59,130,246,0.13); color: #7aa9ff; }
    .trust-icon.green { background: rgba(34,197,94,0.13); color: #4ade80; }
    .trust-icon.purple { background: rgba(139,92,246,0.13); color: #a78bfa; }
    .trust-icon.gold { background: rgba(245,158,11,0.13); color: #fbbf24; }
    .trust-value { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 1rem; color: #eef3ff; line-height: 1.1; }
    .trust-label { font-size: 0.65rem; color: #6a7893; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600; margin-top: 2px; }
    .watchlist-label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.8px; color: #5f6d88; font-weight: 700; margin-bottom: 8px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
    .watchlist-label .cat-tabs { display: flex; gap: 6px; flex-wrap: wrap; }
    .cat-tab { background: #0f131c; border: 1px solid #1e2532; color: #6a7893; padding: 4px 10px; border-radius: 100px; font-size: 0.65rem; font-weight: 700; cursor: pointer; text-transform: uppercase; letter-spacing: 0.5px; }
    .cat-tab.active { background: #1e2532; color: #e9edf5; border-color: #2b3547; }
    .asset-pills { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 8px; scrollbar-width: none; }
    .asset-pills::-webkit-scrollbar { display: none; }
    .asset-pill { display: flex; align-items: center; gap: 8px; padding: 9px 14px; background: #0f131c; border: 1px solid #1e2532; border-radius: 100px; cursor: pointer; white-space: nowrap; transition: 0.18s; font-size: 0.8rem; font-weight: 600; color: #8898b8; }
    .asset-pill:hover { background: #161d29; }
    .asset-pill.active { background: rgba(59,130,246,0.13); border-color: #3b82f6; color: #c8d7ff; box-shadow: 0 0 0 1px rgba(59,130,246,0.25); }
    .asset-pill .pill-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .asset-pill .sym { font-family: 'JetBrains Mono', monospace; letter-spacing: 0.3px; }
    .main-grid { display: grid; grid-template-columns: 1fr 320px; gap: 22px; }
    .left-col { display: flex; flex-direction: column; gap: 22px; }
    .card { background: #0f131c; border-radius: 26px; border: 1px solid #1e2532; padding: 20px 22px; }
    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; flex-wrap: wrap; gap: 12px; }
    .asset-title { display: flex; align-items: center; gap: 14px; }
    .asset-icon { background: #1b2231; width: 44px; height: 44px; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 1.4rem; color: #f0b90b; }
    .asset-name { font-weight: 700; font-size: 1.3rem; }
    .asset-pair { color: #7b88a4; font-size: 0.8rem; font-weight: 500; margin-top: 2px; }
    .price-badge { display: flex; align-items: baseline; gap: 14px; background: #151c27; padding: 8px 16px; border-radius: 100px; border: 1px solid #252e3e; }
    .current-price { font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 1.4rem; }
    .price-change { font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 0.9rem; padding: 4px 10px; border-radius: 100px; background: rgba(34,197,94,0.15); color: #22c55e; }
    .price-change.negative { background: rgba(239,68,68,0.12); color: #ef4444; }
    .chart-container { width: 100%; height: 220px; background: #0b0f16; border-radius: 16px; padding: 10px; }
    #priceChart { width: 100%; height: 100%; display: block; }
    .chart-labels { display: flex; justify-content: space-between; color: #4e5b74; font-size: 0.7rem; padding: 0 6px; margin-top: 6px; }
    .stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-top: 16px; }
    .stat-item { background: #111823; border-radius: 18px; padding: 12px 16px; border: 1px solid #1e2637; }
    .stat-label { font-size: 0.7rem; text-transform: uppercase; color: #6a7893; font-weight: 600; margin-bottom: 6px; }
    .stat-value { font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 1.15rem; }
    .order-book-card { height: 100%; display: flex; flex-direction: column; }
    .order-book-header { display: flex; justify-content: space-between; margin-bottom: 16px; }
    .order-book-header h3 { font-weight: 600; font-size: 1.1rem; }
    .spread-tag { background: #1b2332; padding: 4px 10px; border-radius: 40px; font-size: 0.7rem; font-weight: 600; color: #a6b3d0; }
    .order-book-list { display: flex; flex-direction: column; gap: 2px; font-family: 'JetBrains Mono', monospace; font-size: 0.8rem; }
    .order-row { display: flex; justify-content: space-between; padding: 5px 8px; border-radius: 8px; }
    .order-row .amount { color: #9aa9c4; }
    .order-row.bid .price { color: #22c55e; }
    .order-row.ask .price { color: #ef4444; }
    .mid-price { display: flex; justify-content: space-between; background: #1a212e; margin: 10px 0; padding: 8px 10px; border-radius: 12px; font-weight: 600; font-size: 0.9rem; }
    .mid-price .value { font-family: 'JetBrains Mono', monospace; color: #b7c8ff; }
    .trade-panel { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
    .buy-sell-box { background: #0f131c; border-radius: 22px; padding: 18px; border: 1px solid #1e2532; }
    .buy-sell-box h4 { font-size: 0.9rem; margin-bottom: 14px; color: #b8c6e3; }
    .input-group { display: flex; flex-direction: column; gap: 12px; margin-bottom: 18px; }
    .input-field { background: #111823; border: 1px solid #252f41; border-radius: 16px; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; }
    .input-field span { color: #6f7d99; font-size: 0.8rem; }
    .input-field input { background: transparent; border: none; color: white; font-family: 'JetBrains Mono', monospace; font-size: 0.95rem; text-align: right; outline: none; width: 100%; }
    .buy-btn, .sell-btn { border: none; color: #0b0e14; font-weight: 700; padding: 14px; border-radius: 18px; font-size: 0.9rem; cursor: pointer; width: 100%; display: flex; justify-content: center; align-items: center; gap: 8px; }
    .buy-btn { background: #22c55e; }
    .sell-btn { background: #ef4444; }

    /* ===== FLOATING BUTTONS ===== */
    .support-float { position: fixed; bottom: 22px; right: 22px; background: linear-gradient(135deg, #3b82f6, #6366f1); color: white; width: 54px; height: 54px; border-radius: 50%; border: none; box-shadow: 0 12px 28px -6px rgba(59,130,246,0.6); cursor: pointer; font-size: 1.3rem; display: none; align-items: center; justify-content: center; z-index: 999; transition: 0.2s; }

    .whatsapp-float:hover { transform: scale(1.06); }

    .support-modal.open { display: flex; }
